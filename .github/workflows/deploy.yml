name: Deploy to GitHub Pages

on:
  push:
    branches:
      - 'release/*'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # Environment Variables (User Configurable) 
    env:
      CNAME: 'cv-editor.fynx.io.vn' # Leave empty if you do not use a custom domain
      VITE_BASE_URL: '/' # Change to '/repo-name/' if using default username.github.io/repo-name path
      VITE_SEO_TITLE: 'CV Editor — Free Harvard-Style Resume & Cover Letter Builder'
      VITE_SEO_DESCRIPTION: 'Write a professional CV and cover letter following the clean Harvard format. Real-time PDF preview, AI STAR method prompt helpers, and instant local imports. 100% free with no registration.'
      VITE_SEO_KEYWORDS: 'harvard resume builder, harvard cv template, star method resume, free resume builder, cover letter builder, export pdf cv, export word resume, free online cv editor, student resume template, AI resume helper'
      VITE_SEO_AUTHOR: 'sjnosukequy & phuongp2003'
      VITE_SEO_CANONICAL: 'https://cv-editor.fynx.io.vn/'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log deploy info
        shell: bash
        run: |
          echo "Deploying branch: ${{ github.ref_name }}"
          echo "SEO Title: ${{ env.VITE_SEO_TITLE }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate CNAME dynamically
        run: |
          if [ ! -z "${{ env.CNAME }}" ]; then
            echo "${{ env.CNAME }}" > public/CNAME
            echo "CNAME created: ${{ env.CNAME }}"
          else
            # Ensure any leftover CNAME is deleted if custom domain is disabled
            rm -f public/CNAME
            echo "CNAME disabled"
          fi

      - name: Build Application
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages # Branch to deploy static assets to
          clean: true
